# Nginx de produção: termina TLS, redireciona HTTP -> HTTPS, e faz o
# mesmo reverse proxy do nginx.conf (dev) para /api/* e /.
#
# ANTES de usar: troque SEU_DOMINIO.com.br pelo domínio real (duas
# ocorrências abaixo) e rode scripts/init-letsencrypt.sh uma vez para
# emitir o primeiro certificado — sem isso, os arquivos em
# /etc/letsencrypt/live/... não existem e o nginx nem sobe.

upstream almox_api {
    server api:3000;
}
upstream almox_frontend {
    server frontend:80;
}

# Necessário para o Certbot validar o domínio (desafio HTTP-01) e
# para redirecionar o resto do tráfego HTTP para HTTPS.
server {
    listen 80;
    server_name SEU_DOMINIO.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name SEU_DOMINIO.com.br;
    client_max_body_size 5M;

    ssl_certificate     /etc/letsencrypt/live/SEU_DOMINIO.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SEU_DOMINIO.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location /health {
        proxy_pass http://almox_api/health;
    }

    location /api/ {
        proxy_pass http://almox_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location / {
        proxy_pass http://almox_frontend/;
        proxy_set_header Host $host;
    }
}
