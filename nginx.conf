# Reverse proxy único para todo o sistema ALMOX//CTRL.
#
# Servir API e frontend pela MESMA origem (mesmo domínio/porta) elimina
# CORS em produção — o navegador nunca faz uma requisição cross-origin,
# então não há preflight, não há header Access-Control-* para acertar,
# e o cookie de refresh token funciona com SameSite=strict sem drama.
# Em desenvolvimento local (frontend em :5173, backend em :3000) ainda
# são origens diferentes, por isso o CORS do backend continua ativo —
# ver backend/src/app.js.

upstream almox_api {
    server api:3000;
}

upstream almox_frontend {
    server frontend:80;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 5M;

    location /health {
        proxy_pass http://almox_api/health;
    }

    location /api/ {
        proxy_pass http://almox_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;   # generoso o bastante para o import-csv de ~1.500 itens
        proxy_send_timeout 60s;
    }

    location / {
        proxy_pass http://almox_frontend/;
        proxy_set_header Host $host;
    }
}

# Em produção, adicione aqui o bloco `listen 443 ssl` com o certificado
# (Let's Encrypt/Certbot) e um `server` extra na porta 80 que só
# redireciona para HTTPS — ver DEPLOY_CHECKLIST.md.
